name: CI/CD Pipeline for React App

on:
  push:
    branches: [ Nadine ]
  pull_request:
    branches: [ Nadine ]

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Run tests
      - name: Run tests
        run: npm test -- --watch=false

      # 5️⃣ Build project
      - name: Build project
        run: npm run build

      # 6️⃣ Continuous Delivery: save build artifact
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/


